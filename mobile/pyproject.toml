[project]
name = "filefit"
version = "1.3.0"
description = "Convert JPG, PNG, PDF and DOCX files and shrink them under a size limit, offline."
readme = "../README.md"
requires-python = ">=3.10"
authors = [{ name = "Dipanjan Banerjee", email = "dipanjanbanerjee20@gmail.com" }]
dependencies = [
    "flet==1.0.5",
    "pillow",
    "pymupdf",
    "python-docx",
]

[tool.flet]
org = "com.dipanjanbanerjee"
product = "FileFit"
company = "Dipanjan Banerjee"
copyright = "Copyright (C) 2026 Dipanjan Banerjee"

[tool.flet.app]
path = "."
module = "main"
exclude = ["build", "storage"]

[tool.flet.splash]
color = "#0D0B1E"
dark_color = "#0D0B1E"

[tool.flet.android]
adaptive_icon_background = "#0D0B1E"
split_per_abi = false
