# Builds every download automatically.
#   - Push a tag like v1.0.1  -> builds everything and publishes a GitHub Release (+ PyPI).
#   - "Run workflow" button    -> builds everything as downloadable test files, publishes nothing.
name: Build and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The DOCX->PDF test needs LibreOffice. It is skipped here so a slow Ubuntu
      # mirror can never block a release; run it locally with LibreOffice installed.
      - run: pip install -e ".[dev]"
      - run: pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - name: Build app folder (for the installer)
        run: pyinstaller --noconfirm --clean FileFit.spec
      - name: Self-test the app folder
        shell: pwsh
        run: |
          $p = Start-Process dist\FileFit\FileFit.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "FileFit.exe --selftest failed ($($p.ExitCode))"; exit 1 }
      - name: Build portable single exe
        shell: bash
        run: FILEFIT_ONEFILE=1 pyinstaller --noconfirm FileFit.spec --distpath dist/portable --workpath build/portable
      - name: Self-test the portable exe
        shell: pwsh
        run: |
          $p = Start-Process dist\portable\FileFit.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Portable --selftest failed ($($p.ExitCode))"; exit 1 }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (python -c "import filefit; print(filefit.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\FileFit.iss
          Move-Item dist\portable\FileFit.exe dist\FileFit-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/FileFit-Setup.exe
            dist/FileFit-Portable.exe

  linux:
    needs: test
    runs-on: ubuntu-22.04   # older base = binary runs on more distros
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - name: Python package for pip / pipx
        run: python -m build
      - name: Standalone Linux app
        run: |
          pyinstaller --noconfirm --clean FileFit.spec
          QT_QPA_PLATFORM=offscreen dist/FileFit/FileFit --selftest
          tar -C dist -czf dist/FileFit-linux-x86_64.tar.gz FileFit
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.whl
            dist/*.tar.gz

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build Android app (.apk)
        working-directory: mobile
        env:
          PYTHONIOENCODING: utf-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
          # Permanent signing key (Settings > Secrets and variables > Actions).
          # Every version must be signed with the same key, or phones refuse the update.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cp -r ../filefit ./filefit
          rm -rf filefit/gui filefit/__pycache__
          pip install "flet[all]==1.0.5"
          VERSION=$(python -c "import filefit; print(filefit.__version__)")
          SIGN=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGN=(--android-signing-key-store "$RUNNER_TEMP/release.jks"
                  --android-signing-key-store-password "$KEYSTORE_PASSWORD"
                  --android-signing-key-password "$KEYSTORE_PASSWORD"
                  --android-signing-key-alias filefit)
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to release a debug-signed APK"; exit 1
          else
            echo "::warning::No signing key secret; building a debug-signed test APK"
          fi
          flet build apk --yes -v --arch arm64-v8a --build-version "$VERSION" --build-number "${{ github.run_number }}" "${SIGN[@]}"
          # Show which key signed it
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs build/apk/*.apk | grep -i 'SHA-256' | head -1 || true
          ls -la build/apk
          du -h build/apk/*.apk
          mkdir -p ../dist && cp "$(ls build/apk/*.apk | head -1)" ../dist/FileFit-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/FileFit-Android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/FileFit-Setup.exe
            out/FileFit-Portable.exe
            out/FileFit-linux-x86_64.tar.gz
            out/FileFit-Android.apk
            out/*.whl
            out/filefit-*.tar.gz

  pypi:
    # Needs a one-time "trusted publisher" setup on pypi.org (see PUBLISHING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: linux, path: out }
      - run: mkdir dist && mv out/*.whl out/filefit-*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
